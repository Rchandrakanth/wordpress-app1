plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running

keyed_groups:
  - key: tags.Name
    prefix: ""
    separator: ""

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address

  ansible_user: "'ubuntu'"

  #ansible_ssh_private_key_file: "'/home/ubuntu/.ssh/mykey3'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
